name: forgegate

services:
  forgegate:
    build:
      context: .
      dockerfile: apps/forgegate/Dockerfile
    environment:
      PORT: 3000
      HOST: 0.0.0.0
      TRUEFORGE_BASE_URL: http://trueforge:8790
    ports:
      - "127.0.0.1:${FORGEGATE_PORT:-3100}:3000"
    depends_on:
      trueforge:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health/ready').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10

  trueforge:
    build:
      context: .
      dockerfile: docker/trueforge.Dockerfile
      args:
        APP_VERSION: ${TRUEFORGE_VERSION:-0.1.4}
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 8790
      PUBLIC_BASE_URL: http://localhost:${TRUEFORGE_PORT:-8790}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      REDIS_URL: redis://redis:6379
      STANDALONE: "false"
    env_file:
      - .env
    ports:
      - "127.0.0.1:${TRUEFORGE_PORT:-8790}:8790"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8790/healthz').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  github-mcp:
    build:
      context: .
      dockerfile: apps/forgegate/Dockerfile
    command: ["node", "apps/forgegate/dist/src/github-mcp-server.js"]
    environment:
      FORGEGATE_DEMO_REPO: ${FORGEGATE_DEMO_REPO:-}
      FORGEGATE_APPROVAL_SECRET: ${FORGEGATE_APPROVAL_SECRET:-}
      FORGEGATE_ALLOWED_PATHS: ${FORGEGATE_ALLOWED_PATHS:-apps/forgegate/src/payment-lab.ts,apps/forgegate/test/payment-lab.test.ts}
      FORGEGATE_BRANCH_PREFIX: ${FORGEGATE_BRANCH_PREFIX:-forgegate/demo-}
      FORGEGATE_MAX_BYTES: ${FORGEGATE_MAX_BYTES:-250000}
      FORGEGATE_MAX_FILES: ${FORGEGATE_MAX_FILES:-10}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_WRITE_TOKEN: ${GITHUB_WRITE_TOKEN:-}
      HOST: 0.0.0.0
      PORT: 8800
    expose:
      - "8800"
    profiles: ["github"]

  postgres:
    image: postgres:17
    env_file:
      - .env
    volumes:
      - trueforge-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  trueforge-postgres:
